<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoValues - Custom Results</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg" href="icon.svg">
    <script src="theme.js"></script>
    <script src="translations.js"></script>
    <script src="i18n.js"></script>
</head>
<body>
    <div class="main-container">
        <div class="main-results-wrapper">
            <div class="top-section">
                <div class="title-container">
                    <h1>NeoValues</h1>
                    <span class="version-text">v4.1</span>
                </div>
                <p class="custom-subtitle" data-i18n="customResults">Custom results</p>
                <div id="results-container"></div>
            </div>

            <div class="bottom-section">
                <div id="label"></div>
                <div id="secondary-label"></div>

                <div id="buttons" style="margin-top: 30px;">
                    <button type="button" onclick="resetCustomResults()" data-i18n="reset">Reset</button>
                    <button type="button" onclick="location.href='index.html'" data-i18n="backToMenu">Back to menu</button>
                </div>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script>
        let customResults = JSON.parse(localStorage.getItem('customQuizResults') || '{}');

        function saveCustomResults() {
            localStorage.setItem('customQuizResults', JSON.stringify(customResults));
        }

        function closeAllValueDropdowns() {
            document.querySelectorAll('.custom-result-item.open').forEach(item => {
                item.classList.remove('open');
                const trigger = item.querySelector('.custom-circle-trigger');
                if (trigger) trigger.setAttribute('aria-expanded', 'false');
            });
        }

        function toggleValueDropdown(itemEl, triggerBtn) {
            const wasOpen = itemEl.classList.contains('open');
            closeAllValueDropdowns();
            if (!wasOpen) {
                itemEl.classList.add('open');
                triggerBtn.setAttribute('aria-expanded', 'true');
            }
        }

        function selectCustomValue(category, valId) {
            if (valId) {
                customResults[category] = valId;
            } else {
                delete customResults[category];
            }
            saveCustomResults();
            closeAllValueDropdowns();
            renderCustomPage();
        }

        function resetCustomResults() {
            customResults = {};
            saveCustomResults();
            closeAllValueDropdowns();
            renderCustomPage();
        }

        function updateCustomMatch() {
            const labelDiv = document.getElementById('label');
            const secondaryLabelDiv = document.getElementById('secondary-label');
            if (!labelDiv || !secondaryLabelDiv) return;

            const hasAnySelection = Object.keys(customResults).length > 0;
            if (!hasAnySelection) {
                labelDiv.style.display = 'none';
                secondaryLabelDiv.style.display = 'none';
                return;
            }

            labelDiv.style.display = 'inline-block';

            // --- 1. EXACT MATCHING ---
            const exactMatches = [];
            for (const [ideologyName, requirements] of Object.entries(ideologies)) {
                const requiredCategories = Object.keys(requirements);
                const isFullMatch = requiredCategories.every(category => {
                    const allowed = Array.isArray(requirements[category])
                        ? requirements[category]
                        : [requirements[category]];
                    return allowed.includes(customResults[category]);
                });

                if (isFullMatch) {
                    exactMatches.push({
                        name: ideologyName,
                        totalRequired: requiredCategories.length
                    });
                }
            }

            exactMatches.sort((a, b) => b.totalRequired - a.totalRequired);
            const finalLabel = exactMatches.length > 0 ? exactMatches[0].name : "No exact match";

            labelDiv.className = "label-bubble";
            labelDiv.style.backgroundColor = labelColors[finalLabel] || "#7a7a7a";
            if (finalLabel !== "No exact match") {
                labelDiv.innerHTML = `<a href="description.html?id=${encodeURIComponent(finalLabel)}&type=ideology" style="color: inherit; text-decoration: none; display: block;">${I18n.getIdeologyName(finalLabel)}</a>`;
            } else {
                labelDiv.innerText = I18n.t("noExactMatch");
            }

            // --- 2. NEXT CLOSEST MATCH ---
            const scoredLabels = Object.entries(ideologies).map(([name, requirements]) => {
                const requiredCategories = Object.keys(requirements);
                const totalRequired = requiredCategories.length;
                let score = 0;
                let penalty = 0;
                let identicalCount = 0;
                let broaderCount = 0;

                requiredCategories.forEach(category => {
                    const allowed = Array.isArray(requirements[category])
                        ? requirements[category]
                        : [requirements[category]];
                    const userVal = customResults[category];
                    if (!userVal) return;

                    if (allowed.includes(userVal)) {
                        score += 1.0;
                        identicalCount++;
                        return;
                    }

                    const userGroup = Object.keys(subCategories[category] || {}).find(group =>
                        subCategories[category][group].includes(userVal)
                    );
                    if (!userGroup) return;

                    const sharesSubCategory = allowed.some(val => {
                        const valGroup = Object.keys(subCategories[category] || {}).find(group =>
                            subCategories[category][group].includes(val)
                        );
                        return valGroup === userGroup;
                    });

                    if (sharesSubCategory) {
                        score += 0.35;
                        broaderCount++;
                    }

                    const allowedGroups = allowed.map(val =>
                        Object.keys(subCategories[category] || {}).find(group =>
                            subCategories[category][group].includes(val)
                        )
                    ).filter(Boolean);

                    const isAllIncompatible = allowedGroups.length > 0 && allowedGroups.every(reqGroup => {
                        const userIncompat = incompatibleSubCategories[userGroup] || [];
                        const reqIncompat = incompatibleSubCategories[reqGroup] || [];
                        return userIncompat.includes(reqGroup) || reqIncompat.includes(userGroup);
                    });

                    if (isAllIncompatible) {
                        penalty = -100;
                    }
                });

                const matchPercentage = totalRequired > 0 && penalty === 0
                    ? (score / totalRequired) * 100
                    : -100;

                return {
                    label: name,
                    score: score + penalty,
                    matchPercentage: Math.round(matchPercentage),
                    identicalCount,
                    broaderCount,
                    totalRequired
                };
            })
            .filter(item => item.label !== finalLabel && item.score > 0)
            .sort((a, b) => {
                if (b.matchPercentage !== a.matchPercentage) return b.matchPercentage - a.matchPercentage;
                if (b.identicalCount !== a.identicalCount) return b.identicalCount - a.identicalCount;
                return b.totalRequired - a.totalRequired;
            });

            secondaryLabelDiv.innerHTML = '';
            secondaryLabelDiv.style.display = 'none';

            if (scoredLabels.length > 0 && scoredLabels[0].matchPercentage > 0) {
                const nextMatch = scoredLabels[0];
                secondaryLabelDiv.className = "label-bubble";
                secondaryLabelDiv.style.display = "inline-block";
                secondaryLabelDiv.style.borderColor = labelColors[nextMatch.label] || "#7a7a7a";
                secondaryLabelDiv.style.color = labelColors[nextMatch.label] || "#7a7a7a";
                secondaryLabelDiv.innerHTML = `<a href="description.html?id=${encodeURIComponent(nextMatch.label)}&type=ideology" style="color: inherit; text-decoration: none; display: block;">${I18n.t("nextClosestMatch")}: ${I18n.getIdeologyName(nextMatch.label)} (${nextMatch.identicalCount}/${nextMatch.totalRequired})</a>`;
            }
        }

        function renderCustomPage() {
            const container = document.getElementById('results-container');
            if (!container) return;

            container.innerHTML = '';

            categories.forEach(category => {
                const selectedVal = customResults[category];
                const item = document.createElement('div');
                item.className = 'result-item custom-result-item';

                const triggerBtn = document.createElement('button');
                triggerBtn.type = 'button';
                triggerBtn.className = 'custom-circle-trigger';
                triggerBtn.setAttribute('aria-haspopup', 'true');
                triggerBtn.setAttribute('aria-expanded', 'false');
                triggerBtn.title = I18n.getCategoryTitle(category);
                triggerBtn.onclick = (e) => {
                    e.stopPropagation();
                    toggleValueDropdown(item, triggerBtn);
                };

                if (selectedVal) {
                    const img = document.createElement('img');
                    img.src = `icons/${category}/${selectedVal}.svg`;
                    img.alt = I18n.getValueName(category, selectedVal);
                    img.className = 'result-icon';
                    img.onerror = () => { img.style.display = 'none'; };
                    triggerBtn.appendChild(img);
                } else {
                    const emptyCircle = document.createElement('div');
                    emptyCircle.className = 'empty-value-circle';
                    triggerBtn.appendChild(emptyCircle);
                }

                const labelText = document.createElement('p');
                labelText.className = 'result-text';
                labelText.innerText = selectedVal
                    ? I18n.getValueName(category, selectedVal)
                    : I18n.getCategoryTitle(category);

                const dropdown = document.createElement('div');
                dropdown.className = 'value-dropdown';
                dropdown.setAttribute('role', 'menu');
                dropdown.onclick = (e) => e.stopPropagation();

                if (selectedVal) {
                    const clearBtn = document.createElement('button');
                    clearBtn.type = 'button';
                    clearBtn.className = 'value-option-btn value-clear-btn';
                    clearBtn.innerText = `× ${I18n.t("clearSelection")}`;
                    clearBtn.onclick = () => selectCustomValue(category, null);
                    dropdown.appendChild(clearBtn);
                }

                const valueIds = categoryValues[category] || [];
                valueIds.forEach(valId => {
                    const optBtn = document.createElement('button');
                    optBtn.type = 'button';
                    optBtn.className = `value-option-btn ${valId === selectedVal ? 'selected' : ''}`;
                    optBtn.onclick = () => selectCustomValue(category, valId);

                    const optImg = document.createElement('img');
                    optImg.src = `icons/${category}/${valId}.svg`;
                    optImg.alt = '';
                    optImg.className = 'value-option-icon';
                    optImg.onerror = () => { optImg.style.display = 'none'; };

                    const optLabel = document.createElement('span');
                    optLabel.className = 'value-option-label';
                    optLabel.innerText = I18n.getValueName(category, valId);

                    optBtn.appendChild(optImg);
                    optBtn.appendChild(optLabel);
                    dropdown.appendChild(optBtn);
                });

                item.appendChild(triggerBtn);
                item.appendChild(labelText);
                item.appendChild(dropdown);
                container.appendChild(item);
            });

            updateCustomMatch();
        }

        document.addEventListener('DOMContentLoaded', renderCustomPage);
        window.addEventListener('languageChanged', renderCustomPage);
        document.addEventListener('click', closeAllValueDropdowns);
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeAllValueDropdowns();
        });
    </script>
</body>
</html>
