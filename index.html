<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoValues</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg" href="icon.svg">
    <script src="theme.js"></script>
    <script src="translations.js"></script>
    <script src="i18n.js"></script>
</head>
<body>
    <button class="theme-toggle-corner" onclick="toggleTheme()" aria-label="Toggle light/dark mode">
        <svg width="80" height="80" viewBox="0 0 250 250" aria-hidden="true">
            <path d="M0,0 L250,250 L250,0 Z"></path>
            <g class="icon-sun" transform="translate(142, 52) scale(2.2)">
                <circle cx="12" cy="12" r="4"></circle>
                <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
            </g>
            <g class="icon-moon" transform="translate(142, 52) scale(2.2)">
                <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
            </g>
        </svg>
    </button>

    <div class="main-container">
        <h1>NeoValues</h1>
        <div id="buttons">
            <button onclick="location.href='Instruction.html'" data-i18n="start"></button>
            <button onclick="location.href='custom.html'" data-i18n="customResults"></button>
            <button onclick="location.href='values.html'" data-i18n="values"></button>
            <button onclick="location.href='ideologies.html'" data-i18n="ideologies"></button>
            <button onclick="location.href='changelog.html'" data-i18n="changelog"></button>
            <button onclick="location.href='contact.html'" data-i18n="contact"></button>
            <button onclick="location.href='licpage.html'" data-i18n="license"></button>
            <button onclick="location.href='https://neomediavalist.github.io/mytests/'" data-i18n="otherTests"></button>
        </div>

        <div class="footer-icons">
            <a href="support.html" title="Support" class="footer-icon-link">
                <img src="support.svg" alt="Support" class="footer-icon">
            </a>
            <a href="https://discord.gg/PBHjxkpMUY" target="_blank" rel="noopener noreferrer" title="Discord" class="footer-icon-link">
                <img src="discord.svg" alt="Discord" class="footer-icon">
            </a>
            <a href="https://github.com/neomediavalist/neovalues" target="_blank" rel="noopener noreferrer" title="GitHub" class="footer-icon-link">
                <img src="github.svg" alt="GitHub" class="footer-icon">
            </a>
        </div>
    </div>
</body>
</html>
