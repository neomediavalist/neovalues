<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoValues - All Values</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg" href="icon.svg">
    <script src="theme.js"></script>
    <script src="translations.js"></script>
    <script src="data.js"></script>
    <script src="i18n.js"></script>
</head>
<body>
    <div class="main-container">
        <h1 data-i18n="allValuesTitle">All Values</h1>
        <p class="intro-text" data-i18n="allValuesIntro">
            Below is a collection of all values included in NeoValues. Click on any icon to view its detailed description and original source.
        </p>

        <div id="values-container"></div>

        <div id="buttons" style="margin-top: 40px; padding-bottom: 60px;">
            <button onclick="location.href='index.html'" data-i18n="back">Back</button>
        </div>
    </div>

    <script>
        function renderValues() {
            const container = document.getElementById('values-container');
            if (!container) return;
            container.innerHTML = '';

            categories.forEach(category => {
                const valueIds = categoryValues[category];
                if (!valueIds || valueIds.length === 0) return;

                const section = document.createElement('div');
                section.className = 'category-section';

                const title = document.createElement('h2');
                title.className = 'category-title';
                title.innerText = I18n.getCategoryTitle(category);
                section.appendChild(title);

                const flexContainer = document.createElement('div');
                flexContainer.className = 'values-flex-container';

                valueIds.forEach(id => {
                    const wrapper = document.createElement('a');
                    wrapper.className = 'result-item';
                    wrapper.href = `description.html?id=${id}&cat=${category}`;
                    wrapper.style.textDecoration = 'none';
                    wrapper.style.color = 'inherit';

                    const img = document.createElement('img');
                    img.src = `icons/${category}/${id}.svg`;
                    img.className = 'result-icon';
                    img.alt = I18n.getValueName(category, id);
                    img.onerror = () => { img.style.display = 'none'; };

                    const name = document.createElement('p');
                    name.innerText = I18n.getValueName(category, id);
                    name.className = 'result-text';

                    wrapper.appendChild(img);
                    wrapper.appendChild(name);
                    flexContainer.appendChild(wrapper);
                });

                section.appendChild(flexContainer);
                container.appendChild(section);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderValues();
        });

        window.addEventListener('languageChanged', () => {
            renderValues();
        });
    </script>
</body>
</html>
